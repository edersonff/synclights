[package]
name = "synclights"
version = "0.1.0"
edition = "2021"
description = "Low-latency native Linux controller for ROBOBLOQ SyncLight"
license = "MIT"

[dependencies]
libc = "0.2.191"
x11rb = { version = "0.13.2", features = ["randr", "xfixes"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
